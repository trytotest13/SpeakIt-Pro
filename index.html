<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>SpeakIt Pro - Native TTS Engine</title>
    <meta name="title" content="SpeakIt Pro - Native TTS Engine">
    <meta name="description" content="Convert documents into high-quality spoken audio locally. 100% private, no API limits.">
    <meta name="theme-color" content="#121212">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="w-full max-w-[800px] bg-[#1a1a1a] rounded-[32px] p-8 sm:p-10 shadow-2xl relative overflow-hidden border border-[#2a2a2a]">
        
        <header class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">SpeakIt Pro</h1>
            </div>
            <div class="inline-flex items-center gap-2 bg-[#222] border border-[#333] px-4 py-2 rounded-full" aria-live="polite">
                <span class="status-dot"></span>
                <span class="text-xs font-semibold text-[#a3a3a3] uppercase tracking-wider">Local Engine Ready</span>
            </div>
        </header>

        <section class="space-y-6">
            <!-- Text Input Area -->
            <div class="space-y-3">
                <div class="flex justify-between items-end px-1">
                    <label for="text-input" class="text-sm font-semibold text-[#737373] uppercase tracking-wider">Document Content</label>
                    <div class="flex space-x-4 text-xs font-medium text-[#737373]" aria-live="polite">
                        <span>Words: <span id="word-count" class="text-[#d4d4d4]">0</span></span>
                        <span>Chars: <span id="char-count" class="text-[#d4d4d4]">0</span></span>
                    </div>
                </div>
                
                <textarea 
                    id="text-input" rows="5" maxlength="200000"
                    placeholder="Enter or paste your text here to speak..." 
                    aria-label="Text to convert to speech"
                    class="w-full bg-[#222] border border-[#333] focus:border-[#22d3ee]/50 rounded-2xl px-5 py-4 text-[#ededed] text-base leading-relaxed transition-all resize-none outline-none placeholder:text-[#525252]"
                ></textarea>
            </div>

            <!-- Player UI -->
            <div id="player-ui" class="bg-[#222] rounded-[24px] p-8 space-y-8 hidden border border-[#333]" role="region" aria-label="Audio Player">
                
                <!-- Progress & Timeline -->
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <div class="space-y-1">
                            <span class="text-[11px] text-[#737373] uppercase font-bold tracking-wider">Document Progress</span>
                            <div class="text-2xl font-bold text-white" id="progress-text" aria-live="polite">Part 1 of 2</div>
                        </div>
                        <div class="text-right space-y-1">
                            <span class="text-[11px] text-[#737373] uppercase font-bold tracking-wider">Completion</span>
                            <div class="text-lg font-medium text-[#a3a3a3]" id="percentage-display" aria-live="polite">0%</div>
                        </div>
                    </div>
                    
                    <div class="pt-2 pb-1 relative">
                        <div class="relative w-full flex items-center h-4">
                            <div class="absolute inset-x-0 h-1.5 bg-[#333333] rounded-full overflow-hidden pointer-events-none">
                                <div id="seek-fill" class="h-full bg-[#22d3ee] transition-all duration-300" style="width: 0%;"></div>
                            </div>
                            <input type="range" id="seek-bar" min="0" max="1" value="0" step="1" class="w-full relative z-10 cursor-pointer" aria-label="Text chunk progress">
                        </div>
                    </div>
                </div>

                <!-- Settings Box -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border border-[#333] bg-[#1a1a1a] rounded-[20px] p-6 items-center">
                    
                    <!-- Voice Selector -->
                    <div class="md:col-span-2 space-y-3">
                        <label for="voice-select" class="text-[11px] font-bold text-[#737373] uppercase tracking-wider block">Voice Profile</label>
                        <select id="voice-select" class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm font-medium text-[#ededed] outline-none cursor-pointer focus:border-[#22d3ee]/50 transition-colors">
                            <option value="">System Default Voice</option>
                        </select>
                    </div>

                    <!-- Volume -->
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <label for="volume-slider" class="text-[11px] font-bold text-[#737373] uppercase tracking-wider block">Volume</label>
                            <span id="volume-label" class="text-[10px] font-bold text-[#a3a3a3]">100%</span>
                        </div>
                        <div class="flex items-center space-x-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#a3a3a3]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h2l4 4V6L7 10H5z" /></svg>
                            <div class="relative w-full flex items-center h-4">
                                <div class="absolute inset-x-0 h-1.5 bg-[#333333] rounded-full overflow-hidden pointer-events-none">
                                    <div id="volume-fill" class="h-full bg-[#22d3ee] transition-all duration-75" style="width: 100%;"></div>
                                </div>
                                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" class="w-full relative z-10 cursor-pointer" aria-label="Volume">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Speed -->
                    <div class="space-y-3">
                        <label for="speed-control" class="text-[11px] font-bold text-[#737373] uppercase tracking-wider block">Playback Speed</label>
                        <select id="speed-control" class="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-3 text-sm font-medium text-[#ededed] outline-none cursor-pointer focus:border-[#22d3ee]/50 transition-colors">
                            <option value="0.5">0.5x Slower</option>
                            <option value="0.75">0.75x Slow</option>
                            <option value="1" selected>1.0x Normal</option>
                            <option value="1.25">1.25x Fast</option>
                            <option value="1.5">1.5x Faster</option>
                            <option value="2">2.0x Double</option>
                        </select>
                    </div>
                </div>

                <!-- Transport Controls -->
                <div class="flex items-center justify-center space-x-12 pt-2">
                    <div class="flex flex-col items-center group cursor-pointer control-btn" id="prev-btn-wrapper">
                        <button id="prev-btn" aria-label="Previous Part" class="text-[#737373] group-hover:text-white mb-2 transition-colors disabled:opacity-30">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
                        </button>
                        <span class="text-[11px] font-bold text-[#737373] group-hover:text-white uppercase tracking-wider transition-colors">Previous Part</span>
                    </div>
                    
                    <div class="flex flex-col items-center">
                        <button id="play-btn-main" aria-label="Play or Pause Audio" class="w-20 h-20 rounded-full border-[3px] border-[#22d3ee] flex items-center justify-center glowing-play bg-transparent transition-all active:scale-95 mb-2 group">
                            <svg id="play-icon-main" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-[#22d3ee] ml-1">
                                <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 20.027c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" />
                            </svg>
                            <svg id="stop-icon-main" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-[#22d3ee] hidden">
                                <path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 01.75-.75H9a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H7.5a.75.75 0 01-.75-.75V5.25zm7.5 0a.75.75 0 01.75-.75h1.5a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V5.25z" clip-rule="evenodd" />
                            </svg>
                        </button>
                        <span id="play-status-text" class="text-[11px] font-bold text-white uppercase tracking-wider">Play</span>
                    </div>
                    
                    <div class="flex flex-col items-center group cursor-pointer control-btn" id="next-btn-wrapper">
                        <button id="next-btn" aria-label="Next Part" class="text-[#737373] group-hover:text-white mb-2 transition-colors disabled:opacity-30">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" /></svg>
                        </button>
                        <span class="text-[11px] font-bold text-[#737373] group-hover:text-white uppercase tracking-wider transition-colors">Next Part</span>
                    </div>
                </div>

                <!-- Text Segment Preview -->
                <div class="border-t border-[#333] pt-6 mt-2">
                    <p id="current-segment-preview" aria-live="polite" class="text-center text-[14px] text-[#a3a3a3] italic leading-relaxed px-2"></p>
                </div>
            </div>

            <!-- Primary Actions -->
            <div id="action-buttons">
                <button id="init-btn" class="w-full bg-[#22d3ee] hover:bg-[#06b6d4] text-black font-bold py-4 rounded-2xl transition-all active:scale-[0.98] shadow-[0_0_20px_rgba(34,211,238,0.2)] text-lg uppercase tracking-wide disabled:opacity-50 disabled:cursor-not-allowed">
                    Initialize Audio
                </button>
            </div>

        </section>
    </main>

    <!-- Link to external JS -->
    <script src="script.js"></script>
</body>
</html>
